<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Agarwal Knowledge Hub educational platform.">
  <meta name="theme-color" content="#1E3C72">

  <!-- Disable browser HTML caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agarwal Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Agarwal Knowledge Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            for (var i = 0; i < registrations.length; i++) {
              try {
                registrations[i].unregister();
              } catch (_) {}
            }
            // Programmatically clear all cache storage to remove stale assets
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (let name of names) {
                  try {
                    caches.delete(name);
                  } catch (_) {}
                }
              }).catch(function(e) {});
            }
            // Reload once to fetch the fresh assets from network
            setTimeout(function() {
              window.location.reload();
            }, 300);
          }
        }).catch(function(e) {});
      }
    } catch (err) {
      console.error("Cache clearing error: ", err);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
